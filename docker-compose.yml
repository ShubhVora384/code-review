name: code-review

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codereview
      POSTGRES_PASSWORD: codereview
      POSTGRES_DB: codereview
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereview -d codereview"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://codereview:codereview@postgres:5432/codereview
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_DIR: /data/workspaces
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - workspaces:/data/workspaces
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://codereview:codereview@postgres:5432/codereview
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_DIR: /data/workspaces
    volumes:
      - ./backend:/app
      - workspaces:/data/workspaces
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: python -m app.workers.main

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  workspaces:
